services:
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  api:
    build:
      context: .
    ports:
      - "6670:6670"
    env_file: .env.production
    volumes:
      - ./downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt:ro
      - yt-dlp-cache:/root/.cache/yt-dlp
    restart: unless-stopped
    depends_on:
      - bgutil
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6670/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  yt-dlp-cache:
