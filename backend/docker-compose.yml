services:
  bgutil:
    build:
      context: .
      dockerfile: bgutil.Dockerfile
    restart: unless-stopped

  api:
    build: .
    ports:
      - "6670:6670"
    env_file: .env.production
    volumes:
      - ./downloads:/app/downloads
      - ./cookies.txt:/cookies.txt
      - yt-dlp-cache:/root/.cache/yt-dlp
    restart: unless-stopped
    depends_on:
      - bgutil
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6670/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  yt-dlp-cache:
