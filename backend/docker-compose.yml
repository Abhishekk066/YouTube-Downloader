version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "6670:6670"
    env_file: .env
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6670/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
